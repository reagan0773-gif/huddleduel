<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0c1320">
<title>Huddle Duel</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* App shell reset */
:root{--sa-t:var(--safe-area-inset-top,env(safe-area-inset-top,0px));--sa-r:var(--safe-area-inset-right,env(safe-area-inset-right,0px));
  --sa-b:var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px));--sa-l:var(--safe-area-inset-left,env(safe-area-inset-left,0px));
  padding-top:var(--sa-t);padding-bottom:var(--sa-b)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-size:14px;overscroll-behavior:none;-webkit-text-size-adjust:100%}
button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout: one phone-width column — stadium scoreboard on top, turf strip, then the call sheet. Single committed night-game look. */
:root{
  --night:#0c1320; --board:#141e2f; --panel:#1a2639; --line:#2a3850;
  --bulb:#ffb547; --chalk:#eef1ea; --muted:#8d99ad;
  --turf:#2e7a3c; --turf2:#286c35; --flag:#f4d22b; --los:#58aaff;
  --home:#e04a3a; --away:#3d8bef; --good:#4cc77a; --bad:#ff6a5a;
  --f-display:"Graduate","Rockwell","Georgia",serif;
  --f-body:"Barlow Semi Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --f-num:"Chivo Mono","SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{background:var(--night);color:var(--chalk)}
body{font-family:var(--f-body);font-size:16px;line-height:1.35;-webkit-tap-highlight-color:transparent}
.wrap{max-width:520px;margin:0 auto;padding-block:12px 32px;padding-left:max(16px,var(--sa-l));padding-right:max(16px,var(--sa-r));display:flex;flex-direction:column;gap:12px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--bulb);outline-offset:2px}

/* Top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-family:var(--f-display);font-size:20px;letter-spacing:.04em;color:var(--bulb)}
.topbtns{display:flex;gap:6px}
.ghost{background:transparent;border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:14px;font-weight:600;color:var(--muted)}

/* Scoreboard */
.board{background:var(--board);border:2px solid #000;border-radius:10px;box-shadow:inset 0 0 0 1px var(--line);padding:10px;display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.team{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.tname{font-family:var(--f-display);font-size:14px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;display:flex;align-items:center;gap:6px}
.tname .sw{width:10px;height:10px;border-radius:2px;flex:none}
.score{font-family:var(--f-num);font-size:44px;font-weight:700;color:var(--bulb);line-height:1;text-shadow:0 0 12px rgba(255,181,71,.35);font-variant-numeric:tabular-nums}
.ball-ind{height:14px;font-size:12px;color:var(--bulb);letter-spacing:.08em;font-weight:700}
.mid{display:flex;flex-direction:column;align-items:center;gap:2px;padding:0 6px}
.clock{font-family:var(--f-num);font-size:26px;font-weight:700;color:var(--bulb);font-variant-numeric:tabular-nums;background:#000;border-radius:4px;padding:2px 8px}
.qtr{font-size:12px;letter-spacing:.14em;color:var(--muted);font-weight:700;text-transform:uppercase}

/* Field */
.field{position:relative;height:74px;border-radius:6px;overflow:hidden;background:repeating-linear-gradient(90deg,var(--turf) 0 4.2%,var(--turf2) 4.2% 8.4%);border:2px solid var(--chalk)}
.ez{position:absolute;top:0;bottom:0;width:8%;display:flex;align-items:center;justify-content:center}
.ez span{writing-mode:vertical-rl;font-family:var(--f-display);font-size:9px;letter-spacing:.12em;color:rgba(255,255,255,.85);white-space:nowrap;overflow:hidden;max-height:90%}
.ez.l{left:0;background:var(--home)} .ez.r{right:0;background:var(--away)}
.yl{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.55)}
.yn{position:absolute;bottom:3px;transform:translateX(-50%);font-family:var(--f-num);font-size:9px;color:rgba(255,255,255,.8)}
.fd{position:absolute;top:0;bottom:0;width:3px;background:var(--flag);transform:translateX(-50%);box-shadow:0 0 6px var(--flag)}
.los{position:absolute;top:0;bottom:0;width:3px;background:var(--los);transform:translateX(-50%)}
.ballmk{position:absolute;top:24px;width:20px;height:13px;transform:translateX(-50%);transition:left .6s cubic-bezier(.3,.7,.2,1)}
.fd,.los{transition:left .6s cubic-bezier(.3,.7,.2,1)}
@media (prefers-reduced-motion:reduce){.ballmk,.fd,.los{transition:none}}

/* Situation */
.sit{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.dd{font-family:var(--f-display);font-size:24px;letter-spacing:.02em}
.spot{font-size:15px;color:var(--muted);font-weight:600}
.spot b{color:var(--chalk)}

/* Panel */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ph h2{margin:0;font-family:var(--f-display);font-size:17px;letter-spacing:.05em;text-transform:uppercase;text-wrap:balance}
.side{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:999px}
.side.o{background:rgba(76,199,122,.16);color:var(--good)} .side.d{background:rgba(88,170,255,.16);color:var(--los)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.play{text-align:left;background:var(--board);border:1px solid var(--line);border-radius:8px;padding:10px 11px;display:flex;flex-direction:column;gap:2px;min-width:0;transition:border-color .15s,transform .1s}
.play:active{transform:scale(.97)}
.play:hover{border-color:var(--bulb)}
.play .pn{font-weight:700;font-size:16px;display:flex;justify-content:space-between;gap:6px}
.play .pt{font-size:13px;color:var(--muted)}
.tag{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);align-self:center}
.tag.run{color:#e8a35a} .tag.pass{color:#7fc0ff}
.special{border-style:dashed}
.play[disabled]{opacity:.35;cursor:not-allowed}
.big{background:var(--bulb);color:#1a1205;border:0;border-radius:8px;padding:13px;font-weight:700;font-size:17px;letter-spacing:.03em;width:100%}
.big.alt{background:transparent;color:var(--chalk);border:1px solid var(--line)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* Result */
.match{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;font-weight:600;color:var(--muted);font-size:15px}
.match b{color:var(--chalk)}
.dice{display:flex;gap:8px;justify-content:center}
.die{width:38px;height:38px;background:var(--chalk);border-radius:7px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:5px;box-shadow:0 2px 0 #9aa}
.pip{width:7px;height:7px;border-radius:50%;background:#16202e;align-self:center;justify-self:center}
.roll{animation:roll .45s ease-out}
@keyframes roll{0%{transform:rotate(-200deg) scale(.6)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.roll{animation:none}}
.outcome{text-align:center;font-family:var(--f-display);font-size:28px;line-height:1.1;text-wrap:balance}
.outcome.good{color:var(--good)} .outcome.bad{color:var(--bad)} .outcome.score{color:var(--bulb)}
.detail{text-align:center;color:var(--chalk);font-size:16px;text-wrap:balance}

/* Handoff */
.handoff{text-align:center;padding:18px 6px;display:flex;flex-direction:column;gap:12px;align-items:center}
.handoff .who{font-family:var(--f-display);font-size:24px}
.handoff p{margin:0;color:var(--muted)}

/* Log */
details.log{background:var(--board);border:1px solid var(--line);border-radius:10px}
details.log summary{padding:10px 14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:13px;color:var(--muted);cursor:pointer}
.log ol{list-style:none;margin:0;padding:0 14px 12px;display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto}
.log li{font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:6px}
.log li b{color:var(--chalk);font-weight:600}
.log .t{font-family:var(--f-num);font-size:12px}

/* Overlay */
.ov{position:fixed;inset:0;background:rgba(5,9,16,.82);display:flex;align-items:flex-start;justify-content:center;overflow:auto;z-index:20;padding-block:calc(24px + var(--sa-t)) 24px;padding-left:max(16px,var(--sa-l));padding-right:max(16px,var(--sa-r))}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;width:100%;max-width:440px;display:flex;flex-direction:column;gap:14px}
.sheet h2{margin:0;font-family:var(--f-display);font-size:22px;color:var(--bulb)}
.sheet h3{margin:4px 0 0;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sheet p,.sheet li{color:var(--chalk);font-size:15px;max-width:65ch}
.sheet ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.field-in{display:flex;flex-direction:column;gap:4px}
.field-in label{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.field-in input,.field-in select{background:var(--board);border:1px solid var(--line);color:var(--chalk);border-radius:8px;padding:10px;font:inherit;font-size:16px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{background:var(--board);border:1px solid var(--line);border-radius:8px;padding:10px;font-weight:700}
.seg button[aria-pressed="true"]{border-color:var(--bulb);color:var(--bulb)}
.seg3{grid-template-columns:repeat(3,1fr)}

/* Polish */
.top{flex-wrap:wrap}
.ghost{display:inline-flex;align-items:center;gap:5px}
.ghost svg{width:16px;height:16px}
.ghost[aria-pressed="false"]{opacity:.55}
.flash{animation:flash 1.2s ease-out}
@keyframes flash{0%,30%{color:#fff;text-shadow:0 0 22px var(--bulb),0 0 40px var(--bulb);transform:scale(1.18)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.flash{animation:none}}
.box{width:100%;border-collapse:collapse;font-size:15px}
.box th,.box td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.box th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.box td:first-child,.box th:first-child{text-align:left;color:var(--muted);font-weight:600}
.box td{font-family:var(--f-num);font-size:14px}
.box tr.tot td{color:var(--bulb);font-weight:700}
.boxwrap{overflow-x:auto}

/* Season hub */
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;flex:none}
.sw.lg{width:34px;height:34px;border-radius:6px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.25)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.gamestage{text-align:center;margin-bottom:-4px}
.hubhead{background:var(--board);border:2px solid #000;box-shadow:inset 0 0 0 1px var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:4px}
.hubhead .eyebrow{color:var(--bulb)}
.hubtitle{font-family:var(--f-display);font-size:28px;line-height:1.1;text-wrap:balance;overflow-wrap:anywhere}
.hubrec{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.hubrec b{font-family:var(--f-num);font-size:34px;color:var(--bulb);text-shadow:0 0 12px rgba(255,181,71,.35);font-variant-numeric:tabular-nums}
.hubrec span{color:var(--muted);font-weight:600}
.opp{display:flex;align-items:center;gap:12px}
.oname{font-family:var(--f-display);font-size:22px;line-height:1.1}
.orec{font-family:var(--f-num);color:var(--muted);font-size:14px}
.scout{background:var(--board);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
.scout p{margin:0;font-size:15px;max-width:65ch}
.rate{display:grid;grid-template-columns:64px 1fr auto;align-items:center;gap:10px;font-size:14px;color:var(--muted);font-weight:600}
.rate b{color:var(--chalk);font-weight:700;min-width:56px;text-align:right}
.pips{display:flex;gap:3px}
.pips i{flex:1;height:8px;border-radius:2px;background:var(--line)}
.pips i.on{background:var(--bulb)}
.note{font-size:13px;color:var(--muted);font-weight:600;margin:0}
.chip{display:inline-flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip b{color:var(--chalk)}
.chip.me{color:var(--bulb)}
.stand td{font-family:var(--f-body);font-size:15px}
.stand td:nth-child(n+3){font-family:var(--f-num);font-size:14px}
.stand td:nth-child(2){text-align:left;color:var(--chalk);max-width:150px}
.stand th:nth-child(2){text-align:left}
.stand tr.me td{background:rgba(255,181,71,.08)}
.stand tr.cut td{border-bottom:2px dashed var(--bulb)}
.games{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.gl{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:8px 10px;background:var(--board);border:1px solid var(--line);border-radius:8px;font-size:15px;color:var(--muted)}
.gl .chip:last-child{justify-content:flex-end}
.gl.mine{border-color:var(--bulb)}
.gl.muted{display:block;text-align:center}
.gs{font-family:var(--f-num);color:var(--chalk);font-weight:700;font-variant-numeric:tabular-nums}
.sched{list-style:none}
.sched li{display:grid;grid-template-columns:44px 22px 1fr auto;align-items:center;gap:8px;color:var(--chalk)}
.wk{font-family:var(--f-num);font-size:12px;color:var(--muted)}
.at{font-size:12px;color:var(--muted)}
.res{font-family:var(--f-num);font-size:13px;font-weight:700}
.res.w{color:var(--good)} .res.l{color:var(--bad)} .res.t{color:var(--muted)} .res.nx{color:var(--bulb)}
.champ{text-align:center}
.record{display:flex;justify-content:center;gap:18px;font-weight:600;color:var(--muted)}
.record b{font-family:var(--f-num);color:var(--chalk);font-size:20px;display:block;text-align:center}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="ov" id="ov" hidden></div>

<script>
(function(){
const OFF=[
 {id:'sneak',n:'QB Sneak',t:'run',tip:'Short-yardage push'},
 {id:'dive',n:'Dive',t:'run',tip:'Quick hit up the middle'},
 {id:'offt',n:'Off Tackle',t:'run',tip:'Power run off the edge'},
 {id:'sweep',n:'Sweep',t:'run',tip:'Wide run, boom or bust'},
 {id:'draw',n:'Draw',t:'run',tip:'Fake pass, then run'},
 {id:'screen',n:'Screen',t:'pass',tip:'Dump-off behind blockers'},
 {id:'slant',n:'Slant',t:'pass',tip:'Quick 5–10 yard throw'},
 {id:'curl',n:'Curl',t:'pass',tip:'10–15 yards'},
 {id:'post',n:'Deep Post',t:'pass',tip:'20+ downfield'},
 {id:'bomb',n:'Bomb',t:'pass',tip:'All or nothing'}
];
const DEF=[
 {id:'goal',n:'Goal Line',tip:'Everyone in the box'},
 {id:'rblitz',n:'Run Blitz',tip:'Shoot the gaps'},
 {id:'base',n:'Base 4-3',tip:'Balanced front'},
 {id:'nickel',n:'Nickel',tip:'Extra DB vs. pass'},
 {id:'zblitz',n:'Zone Blitz',tip:'Pressure, drop a lineman'},
 {id:'prevent',n:'Prevent',tip:'Give short, stop deep'}
];
// Columns follow DEF order: goal, rblitz, base, nickel, zblitz, prevent
const RUN={
 sneak:{m:[1,0,2,3,2,4],s:1.5},
 dive:{m:[1,0,3,5,4,6],s:3},
 offt:{m:[1,1,4,5,3,7],s:4},
 sweep:{m:[2,-2,4,6,5,8],s:6},
 draw:{m:[1,7,2,5,8,6],s:5}
};
const PASS={
 screen:{c:[70,78,65,58,72,75],m:[6,9,5,4,8,6],s:5,sk:[2,2,2,2,3,1],i:[2,2,2,3,3,1]},
 slant:{c:[74,68,62,55,50,76],m:[8,9,7,6,9,6],s:4,sk:[4,8,5,4,9,1],i:[2,2,3,4,5,1]},
 curl:{c:[70,60,58,50,48,72],m:[12,13,11,10,13,8],s:4,sk:[5,10,6,5,10,2],i:[2,2,3,5,4,2]},
 post:{c:[56,50,45,38,40,34],m:[22,24,20,18,24,15],s:8,sk:[6,12,7,6,11,2],i:[3,3,4,6,6,5]},
 bomb:{c:[46,42,33,25,35,15],m:[38,40,36,32,40,25],s:12,sk:[7,14,8,7,13,2],i:[4,4,6,8,7,9]}
};
const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};

let S=null, cfgDraft=null, lastScore=null;
const KEY='huddle-duel-v1';
const rnd=n=>Math.floor(Math.random()*n);
const d6=()=>1+rnd(6);
const other=t=>t==='home'?'away':'home';
const ab=t=>S.names[t].slice(0,3).toUpperCase();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clk=s=>{s=Math.max(0,s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const ord=n=>['','1st','2nd','3rd','4th'][n];
const isHuman=t=>S.mode==='2p'||t==='home';
const fgDist=()=>100-S.ballOn+17;
function fgPct(d){const pts=[[20,99],[30,96],[40,87],[50,68],[55,52],[60,30],[65,10]];if(d<=20)return 99;for(let i=1;i<pts.length;i++){if(d<=pts[i][0]){const[a,pa]=pts[i-1],[b,pb]=pts[i];return Math.round(pa+(pb-pa)*(d-a)/(b-a))}}return 0}
function pick(w){let tot=0;for(const k in w)tot+=w[k];let r=Math.random()*tot;for(const k in w){r-=w[k];if(r<=0)return k}return Object.keys(w)[0]}
function spotTxt(){const b=S.ballOn,p=S.poss;if(b===50)return '50';return b<50?ab(p)+' '+b:ab(other(p))+' '+(100-b)}
function ddTxt(){const g=S.toGo>=100-S.ballOn;return ord(S.down)+' & '+(g?'Goal':S.toGo)}

/* ---------- Sound & haptics (synthesized, no files) ---------- */
const SND={on:true,ctx:null};
try{SND.on=localStorage.getItem(KEY+'-snd')!=='off'}catch(e){}
function ac(){if(!SND.on)return null;try{if(!SND.ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;SND.ctx=new C()}if(SND.ctx.state==='suspended')SND.ctx.resume();return SND.ctx}catch(e){return null}}
function noiseBuf(c,dur){const b=c.createBuffer(1,Math.max(1,Math.floor(c.sampleRate*dur)),c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b}
function env(g,t,a,peak,dec){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+dec)}
function tone(type,f1,f2,dur,peak,lp){const c=ac();if(!c)return;const t=c.currentTime,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);env(g,t,.01,peak,dur);let n=o;if(lp){const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=lp;o.connect(f);n=f}n.connect(g).connect(c.destination);o.start(t);o.stop(t+dur+.05)}
const sfx={
  dice(){const c=ac();if(!c)return;const t=c.currentTime;for(let i=0;i<5;i++){const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain(),at=t+i*.07+Math.random()*.02;s.buffer=noiseBuf(c,.05);f.type='bandpass';f.frequency.value=2200+Math.random()*2200;f.Q.value=3;env(g,at,.002,.5,.04);s.connect(f).connect(g).connect(c.destination);s.start(at)}},
  whistle(){const c=ac();if(!c)return;const t=c.currentTime,o=c.createOscillator(),l=c.createOscillator(),lg=c.createGain(),g=c.createGain();o.frequency.value=2900;l.frequency.value=30;lg.gain.value=140;l.connect(lg).connect(o.frequency);env(g,t,.015,.09,.32);o.connect(g).connect(c.destination);o.start(t);l.start(t);o.stop(t+.4);l.stop(t+.4)},

  const {down,toGo,ballOn}=S, d=fgDist(), {lead,late,half2}=situation();

/* ---------- Play resolution ---------- */
function resolve(){

  const so=S.stats[off];

      r.head=`Punt — ${net} yards`;r.detail=`Returned ${ret}. ${S.names[def]} take over.`;changePoss(spot);}
  } else if(S.offPick==='fg'){

    if(Math.random()*100<p){S.score[off]+=3;r.tone='score';r.head=`${d}-yard field goal is good!`;r.detail=`${S.names[off]} +3`;S.afterScore={kickTo:def};}
    else{r.tone='bad';r.head=`${d}-yard field goal — no good`;const spot=Math.max(20,100-(S.ballOn-7));r.detail=`${S.names[def]} take over.`;changePoss(spot);}

  const by=S.names[off];

}
function applyYards(y,replay,autoFirst){

function applyRes(y,r,off,def,inc){

function doPat(two){
  const t=S.patFor;const ok=Math.random()*100<(two?47:95);
  if(ok)S.score[t]+=two?2:1;
  const txt=two?(ok?'Two-point try is good! +2':'Two-point try fails'):(ok?'Extra point is good. +1':'Extra point — no good');
  S.result.pat={ok,txt};S.patFor=null;addLog(esc(S.names[t])+': '+txt,true);render();
}
function cpuPat(){
  const t=S.patFor,lead=S.score[t]-S.score[other(t)];
  const two=S.quarter>=4&&[-2,-5,-10,1,5].includes(lead);
  doPatSilent(two);
}
function doPatSilent(two){const t=S.patFor;const ok=Math.random()*100<(two?47:95);if(ok)S.score[t]+=two?2:1;
  const txt=two?(ok?'Two-point try is good! +2':'Two-point try fails'):(ok?'Extra point is good. +1':'Extra point — no good');
  S.result.pat={ok,txt};S.patFor=null;addLog(esc(S.names[t])+': '+txt,true);}

function next(){
  if(S.over){return}
  // overtime sudden death
  if(S.quarter===5&&S.score.home!==S.score.away){endGame();return}
  if(S.clock<=0){
    const q=S.quarter;sfx.buzzer();
    if(q===2){S.quarter=3;S.clock=S.qtrLen;S.afterScore=null;addLog('Halftime.',true);kickoff(other(S.firstReceiver));startPlay();return}
    if(q===4||q===5){
      if(S.score.home!==S.score.away||(q===5&&!S.noTies)){endGame();return}
      S.quarter=5;S.clock=Math.min(S.qtrLen,600);S.afterScore=null;const to=Math.random()<.5?'home':'away';
      addLog(`Tied — sudden-death overtime. ${esc(S.names[to])} win the toss.`,true);kickoff(to);startPlay();return}
    S.quarter=q+1;S.clock=S.qtrLen;addLog(`End of quarter ${q}.`,true);
  }
  if(S.afterScore){const a=S.afterScore;S.afterScore=null;kickoff(a.kickTo,a.free);}
  startPlay();
}
function endGame(){S.over=true;S.phase='over';const h=S.score.home,a=S.score.away;S.winner=h===a?null:(h>a?'home':'away');addLog('Final.',true);
  if(S.mode==='cpu'&&!S.recorded){const r=getRecord();if(!S.winner)r.t++;else if(S.winner==='home')r.w++;else r.l++;setRecord(r);S.recorded=true;}
  if(seasonGameLive()){playWeek(h,a);S.seasonDone=true;}
  if(S.winner==='home'||S.mode==='2p'){setTimeout(()=>{sfx.cheer();buzz([80,60,80,60,200])},300)}else setTimeout(()=>sfx.groan(),300);
  render();}

    ${boxHTML()}
    <h3>Your record vs. computer</h3>${recordHTML()}
    <button class="big" data-act="close">Back to the game</button></div>`;
  ov.hidden=false;
}
function closeOv(){const ov=document.getElementById('ov');ov.hidden=true;ov.innerHTML='';cfgDraft=null;}

document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.off||t.dataset.def)buzz(10);
  if(t.dataset.off){if(S.phase==='pickOff')chooseOff(t.dataset.off);return}
  if(t.dataset.def){if(S.phase==='pickDef')chooseDef(t.dataset.def);return}
  const keep=()=>{cfgDraft.home=document.getElementById('nh').value;cfgDraft.away=document.getElementById('na').value};
  if(t.dataset.mode){keep();cfgDraft.mode=t.dataset.mode;showSetup();return}
  if(t.dataset.q){keep();cfgDraft.qtrLen=+t.dataset.q;showSetup();return}
  if(t.dataset.diff!==undefined){keep();cfgDraft.diff=+t.dataset.diff;showSetup();return}
  const a=t.dataset.act;
  if(a==='hub'){VIEW='hub';render();return}
  if(a==='resume'){VIEW='game';render();return}
  if(a==='playweek'){startSeasonGame();return}
  if(a==='simround'){playWeek(null,null);render();return}
  if(a==='newseason'){cfgDraft=null;showSetup();cfgDraft.mode='season';showSetup();return}
  if(a==='sound'){SND.on=!SND.on;try{localStorage.setItem(KEY+'-snd',SND.on?'on':'off')}catch(e){}if(SND.on)sfx.click();render();return}
  if(a==='stats'){showStats();return}
  if(a==='next')next();
  else if(a==='ready'){S.phase=S.handNext;render();}
  else if(a==='pat1')doPat(false);
  else if(a==='pat2')doPat(true);
  else if(a==='setup')showSetup();
  else if(a==='help')showHelp();
  else if(a==='close')closeOv();
  else if(a==='start'){const c=cfgDraft;c.home=document.getElementById('nh').value.trim()||'Comets';c.away=document.getElementById('na').value.trim()||'Ironmen';closeOv();
    if(c.mode==='season')newSeason(c);else{VIEW='game';newGame(c);}}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.getElementById('ov').hidden)closeOv()});

function start(data){
  SEA=(data&&data.SEA)||loadSea();
  const saved=(data&&data.S)||load();
  if(saved&&saved.names&&saved.phase){S=saved;if(!S.stats)S.stats={home:blankStats(),away:blankStats()};lastScore={...S.score};}
  if(data&&data.VIEW)VIEW=data.VIEW;
  else if(SEA&&(!S||(S.season&&S.over)))VIEW='hub';
  else VIEW='game';
  if(VIEW==='game'&&!S){if(SEA){VIEW='hub';render();}else{newGame({mode:'cpu',home:'Comets',away:'Ironmen',qtrLen:300});}return}
  render();
}
window.claude?.hot?.snapshot?.(()=>({S,SEA,VIEW}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
</body>
</html>
